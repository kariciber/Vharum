<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vharum</title>

<style>
  body {
    margin:0;
    background:black;
    overflow:hidden;
    font-family: system-ui, sans-serif;
    color:white;
  }
  #gameContainer {
    position:relative;
    width:100vw;
    height:calc(100vh - 60px);
    overflow:hidden;
  }
  canvas {
    display:block;
    width:100%;
    height:100%;
  }
  #controls {
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:60px;
    background:rgba(0,0,0,0.8);
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    border-top:1px solid rgba(255,255,255,0.1);
  }
  #controls button {
    background:white;
    color:black;
    border:none;
    border-radius:6px;
    padding:8px 16px;
    font-size:16px;
    cursor:pointer;
  }
  #msg {
    position:fixed;
    top:10px; left:10px; right:10px;
    padding:10px 12px;
    background:rgba(0,0,0,0.55);
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.2);
    pointer-events:none;
    z-index:11;
  }
  #startScreen {
    position:fixed;
    inset:0;
    background:black;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:10;
  }
  #startTitle {
    font-size:48px;
    margin-bottom:20px;
    letter-spacing:4px;
  }
  #startBtn {
    padding:12px 24px;
    background:white;
    color:black;
    border:none;
    border-radius:6px;
    font-size:20px;
    cursor:pointer;
  }
  #startScreen.fadeOut {
    opacity:0;
    pointer-events:none;
    transition: opacity 0.8s ease;
  }
  #fade {
    position:fixed;
    inset:0;
    background:black;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.8s ease;
    z-index:9;
  }

  #hotspots {
    position:absolute;
    inset:0;
    z-index:5;
    pointer-events:none;
  }
  .hotspot {
    position:absolute;
    transform:translate(-50%,-50%);
    min-width:64px;
    max-width:36%;
    padding:9px 13px;
    border:1px solid rgba(226,213,197,.65);
    border-radius:999px;
    background:rgba(8,8,10,.7);
    color:#f7eee6;
    font:600 13px system-ui, sans-serif;
    letter-spacing:.02em;
    cursor:pointer;
    pointer-events:auto;
    touch-action:manipulation;
    text-shadow:0 1px 2px #000;
    box-shadow:0 0 18px rgba(0,0,0,.4);
    transition:background .2s, border-color .2s, transform .2s;
  }
  .hotspot:hover, .hotspot.active, .hotspot:focus-visible {
    background:rgba(73,27,33,.95);
    border-color:#ffce8c;
    outline:2px solid transparent;
    transform:translate(-50%,-50%) scale(1.08);
  }

  /* Manos: gráficos vectoriales integrados, sin archivos externos */
  #handsOverlay {
    position:absolute;
    inset:auto 0 -2px 0;
    height:clamp(125px, 29vh, 300px);
    z-index:6;
    opacity:0;
    pointer-events:none;
    user-select:none;
    transition:opacity .45s ease;
    overflow:hidden;
    filter:drop-shadow(0 -8px 13px rgba(0,0,0,.6));
  }
  #handsOverlay.visible { opacity:.88; }
  #handsOverlay svg {
    width:100%;
    height:100%;
    display:block;
  }
  .vharum-hand {
    transform-box:fill-box;
    transform-origin:50% 85%;
    will-change:transform;
  }
  #handsOverlay.walking .vharum-left {
    animation:vharumBobLeft .72s ease-in-out infinite alternate;
  }
  #handsOverlay.walking .vharum-right {
    animation:vharumBobRight .72s ease-in-out infinite alternate;
  }
  #handsOverlay.interacting .vharum-right {
    animation:vharumReach .36s ease-out 1 both;
  }
  @keyframes vharumBobLeft {
    from { transform:translateY(2px) rotate(-1deg); }
    to { transform:translateY(-12px) rotate(2deg); }
  }
  @keyframes vharumBobRight {
    from { transform:translateY(-10px) rotate(1deg); }
    to { transform:translateY(4px) rotate(-2deg); }
  }
  @keyframes vharumReach {
    0% { transform:translate(0,0) rotate(0); }
    45% { transform:translate(-48px,-68px) rotate(-8deg); }
    100% { transform:translate(0,0) rotate(0); }
  }
  @media (prefers-reduced-motion:reduce) {
    #handsOverlay.walking .vharum-hand,
    #handsOverlay.interacting .vharum-hand { animation:none; }
  }
  #controls { z-index:12; }
  @media (max-width:620px) {
    #controls { gap:8px; }
    #controls button { font-size:14px; padding:9px 12px; }
    .hotspot { font-size:12px; padding:8px 10px; max-width:30%; }
    #msg { font-size:13px; }
  }
</style>
</head>

<body>

<div id="startScreen">
  <div id="startTitle">VHARUM - Nivel 1</div>
  <button id="startBtn">Iniciar</button>
</div>

<div id="msg">Cargando imágenes...</div>

<div id="gameContainer">
  <canvas id="c"></canvas>
  <div id="hotspots" aria-label="Puntos de interacción"></div>
  <div id="handsOverlay" aria-hidden="true">
    <svg viewBox="0 0 1200 340" preserveAspectRatio="none" role="presentation" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="vhSleeve" x1="0" y1="0" x2="1" y2=".7">
          <stop offset="0" stop-color="#080a0b"/>
          <stop offset=".5" stop-color="#292b2a"/>
          <stop offset="1" stop-color="#111313"/>
        </linearGradient>
        <linearGradient id="vhSkin" x1=".12" y1=".1" x2=".95" y2=".9">
          <stop offset="0" stop-color="#b39b83"/>
          <stop offset=".3" stop-color="#816655"/>
          <stop offset=".68" stop-color="#5e483c"/>
          <stop offset="1" stop-color="#302824"/>
        </linearGradient>
        <linearGradient id="vhPalm" x1=".15" y1="0" x2=".8" y2="1">
          <stop offset="0" stop-color="#a78b74"/>
          <stop offset=".53" stop-color="#6c5345"/>
          <stop offset="1" stop-color="#342924"/>
        </linearGradient>
        <linearGradient id="vhCuff" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#353634"/>
          <stop offset=".5" stop-color="#171a19"/>
          <stop offset="1" stop-color="#0a0b0c"/>
        </linearGradient>
        <filter id="vhGrain" x="-15%" y="-15%" width="130%" height="130%">
          <feTurbulence type="fractalNoise" baseFrequency=".24" numOctaves="2" seed="8" result="grain"/>
          <feColorMatrix in="grain" type="saturate" values="0" result="grey"/>
          <feComponentTransfer in="grey" result="faint">
            <feFuncA type="linear" slope=".10"/>
          </feComponentTransfer>
          <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
        </filter>
      </defs>

      <!-- Mano izquierda: manga oscura, muñeca y dedos vistos en primera persona -->
      <g class="vharum-hand vharum-left">
        <path d="M33 356 C101 290 143 273 190 262 C233 254 268 278 301 315
                 L319 366 Z" fill="url(#vhSleeve)" stroke="#0e1111" stroke-width="6"/>
        <path d="M182 258 C206 242 233 233 259 233 C278 249 295 277 303 301
                 C276 301 235 314 212 334 Z" fill="url(#vhCuff)" stroke="#080909" stroke-width="5"/>
        <path d="M225 231 C240 211 257 200 279 192
                 C288 186 297 173 307 169
                 C319 162 327 173 323 182 L307 207
                 C316 192 326 163 339 154
                 C350 147 361 154 358 166 L341 212
                 C355 178 367 156 381 153
                 C392 151 399 160 394 171 L373 216
                 C389 184 401 178 409 181 C420 185 419 196 411 208
                 L388 250 C377 271 358 283 338 294
                 C315 303 290 292 265 278
                 L242 270 Z"
              fill="url(#vhSkin)" stroke="#291e1a" stroke-width="3" filter="url(#vhGrain)"/>
        <path d="M244 232 C260 205 286 208 303 222
                 C315 233 325 241 339 249
                 C350 257 354 280 342 291
                 C309 296 284 284 262 274
                 C247 265 238 252 244 232 Z"
              fill="url(#vhPalm)" opacity=".85"/>
        <path d="M306 206 Q319 217 328 230 M339 211 Q348 224 352 232
                 M374 216 Q382 229 384 235"
              fill="none" stroke="#342a24" stroke-width="3" stroke-linecap="round" opacity=".55"/>
        <path d="M269 225 Q287 214 299 222 M286 260 Q311 274 325 269"
              fill="none" stroke="#c0a089" stroke-width="3" stroke-linecap="round" opacity=".35"/>
        <path d="M197 253 Q226 240 252 238" fill="none" stroke="#5a5b52" stroke-width="3" opacity=".5"/>
      </g>

      <!-- Mano derecha independiente: reflejo para mantener perspectiva natural -->
      <g class="vharum-hand vharum-right">
        <g transform="translate(1200 0) scale(-1 1)">
          <path d="M24 362 C96 299 149 275 190 261
                   C236 256 271 279 300 315 L316 365 Z"
                fill="url(#vhSleeve)" stroke="#0b0d0d" stroke-width="6"/>
          <path d="M185 257 C214 237 242 234 267 234
                   C284 254 302 284 305 301 L228 339 Z"
                fill="url(#vhCuff)" stroke="#080909" stroke-width="5"/>
          <path d="M230 237 C245 208 267 196 291 190
                   C302 184 309 166 320 161
                   C331 156 339 168 335 181 L316 207
                   C327 177 342 153 353 151
                   C365 148 372 158 366 174 L348 214
                   C362 181 376 156 388 156
                   C400 159 402 171 395 183 L374 220
                   C389 195 402 187 413 190
                   C422 194 422 205 415 217
                   L392 252 C379 274 351 292 329 294
                   C302 296 272 285 249 269 Z"
                fill="url(#vhSkin)" stroke="#2b201b" stroke-width="3" filter="url(#vhGrain)"/>
          <path d="M246 232 Q275 212 300 220
                   Q319 231 340 250 Q360 274 343 293
                   Q294 291 267 274 Q244 264 246 232 Z"
                fill="url(#vhPalm)" opacity=".88"/>
          <path d="M315 206 Q326 219 334 231 M349 214 Q356 226 358 232
                   M377 220 Q384 232 390 236"
                fill="none" stroke="#352921" stroke-width="3" stroke-linecap="round" opacity=".53"/>
          <path d="M266 227 Q283 215 302 223 M293 259 Q317 274 335 269"
                fill="none" stroke="#d0af93" stroke-width="3" stroke-linecap="round" opacity=".33"/>
        </g>
      </g>
    </svg>
  </div>
</div>

<div id="controls">
  <button id="btnMenu">Volver</button>
  <button id="btnHelp">Ayuda</button>
  <button id="btnExit">Inicio</button>
</div>

<div id="fade"></div>

<script>
(() => {

  // 🔗 ASSETS CORRECTOS SEGÚN TU CARPETA
  const FILES = {
    bgDark: "assets/pasillooscuro.png",
    bgLight: "assets/pasilloluz.png",
    threeDoorsDark: "assets/trespuertasoscuras.png",
    threeDoorsLight: "assets/trespuertasluz.png",
    doorOpen: "assets/habitacioncontunel.png",
    ascensorOpen: "assets/ascensorabiertoplanta2.png",
    ascensorLight: "assets/ascensorabiertoplanta2luz.png",
    planta2: "assets/planta2.png",
    grate: "assets/habitacionconrejilla.png",
    exitRoom: "assets/habitacionexit.png"
  };

  const startScreen = document.getElementById("startScreen");
  const startBtn = document.getElementById("startBtn");
  const msg = document.getElementById("msg");
  const fade = document.getElementById("fade");
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  // 📐 Resize fiable
  function resize() {
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    canvas.width = Math.floor(canvas.clientWidth * dpr);
    canvas.height = Math.floor(canvas.clientHeight * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener("resize", resize);
  resize();

  // 🖼️ Loader con debug
  // Primero recursos locales; si faltan, usa las mismas imágenes del repositorio.
  // Un index.html abierto desde el ordenador también puede funcionar con Internet.
  function load(url) {
    return new Promise((resolve, reject) => {
      const remote = "https://raw.githubusercontent.com/kariciber/Vharum/main/" + url;
      const candidates = window.location.protocol === "file:"
        ? [remote, url]
        : [url, remote];
      const img = new Image();
      let index = 0;
      function attempt() {
        if (index >= candidates.length) {
          console.error("❌ No se pudo cargar", url, candidates);
          reject(url);
          return;
        }
        const candidate = candidates[index++];
        img.onload = () => {
          console.log("✔ Imagen cargada", candidate);
          resolve(img);
        };
        img.onerror = () => {
          console.warn("Reintentando imagen desde otra ruta:", candidate);
          attempt();
        };
        img.src = candidate;
      }
      attempt();
    });
  }

  // Los recursos se cargan en segundo plano: el botón Iniciar nunca queda sin respuesta.
  const images = {};
  const failedFiles = new Set();
  let loadedImages = 0;
  const totalImages = Object.keys(FILES).length;

  function updateLoadStatus() {
    if (failedFiles.size) {
      const first = failedFiles.values().next().value;
      msg.textContent = "Imagen no disponible: " + FILES[first] +
        ". Comprueba la ruta o recarga la página.";
    } else if (!running) {
      msg.textContent = loadedImages < totalImages ?
        "Cargando imágenes " + loadedImages + "/" + totalImages + "..." :
        "Listo - Pulsa Iniciar";
    } else {
      showSceneHint();
    }
  }

  for (const [key, url] of Object.entries(FILES)) {
    load(url).then(img => {
      images[key] = img;
      loadedImages++;
      updateLoadStatus();
    }).catch(() => {
      failedFiles.add(key);
      updateLoadStatus();
    });
  }

  // Fase 1: exploración por puntos sin motor 3D.
  const SCENES = {
    corridor: {
      title: "Pasillo principal",
      hint: "W o ↑ para avanzar. También puedes pulsar el punto iluminado.",
      dark: "bgDark", light: "bgLight",
      choices: [{label:"Avanzar", to:"doors", x:50, y:65}]
    },
    doors: {
      title: "Cruce de las tres puertas",
      hint: "Elige una puerta. A/D o ←/→ para seleccionar, E para abrir.",
      dark: "threeDoorsDark", light: "threeDoorsLight",
      choices: [
        {label:"Izquierda", to:"grate", x:24, y:60},
        {label:"Centro", to:"tunnel", x:50, y:60},
        {label:"Derecha", to:"exitRoom", x:76, y:60}
      ]
    },
    grate: {
      title: "Habitación de la rejilla",
      hint: "La rejilla impide continuar por aquí. Pulsa V o el botón Volver.",
      image: "grate", choices:[]
    },
    tunnel: {
      title: "Habitación del túnel",
      hint: "El túnel conduce hacia un ascensor. Pulsa E para seguir.",
      image: "doorOpen",
      choices:[{label:"Seguir", to:"lift", x:50, y:60}]
    },
    exitRoom: {
      title: "La salida",
      hint: "Una salida aparente, pero este camino acaba aquí por ahora.",
      image: "exitRoom", choices:[]
    },
    lift: {
      title: "Ascensor",
      hint: "Pulsa E o haz clic para subir a la planta 2.",
      dark: "ascensorOpen", light: "ascensorLight",
      choices:[{label:"Planta 2", to:"floor2", x:50, y:65}]
    },
    floor2: {
      title: "Planta 2",
      hint: "Fin de esta ruta de prueba. Pulsa V o Volver para seguir explorando.",
      image:"planta2", choices:[]
    }
  };

  const spots = document.getElementById("hotspots");
  const handsOverlay = document.getElementById("handsOverlay");
  const keys = {};
  const minZ = 1, maxZ = 2.2;
  let z = 1;
  let scene = "corridor";
  let history = [];
  let selected = 0;
  let interacting = false;
  let running = false;
  let pendingTransition = null;
  let previousFrame = 0;

  // Parpadeo breve, sin impedir que la persona explore.
  let useLight = false;
  let nextF = performance.now() + 800;
  function blink(t) {
    if (t < nextF) return;
    useLight = !useLight;
    nextF = t + (useLight ? 80 + Math.random() * 220 :
      700 + Math.random() * 1800);
  }

  function showSceneHint() {
    const current = SCENES[scene];
    if (!current) return;
    const choice = current.choices.length > 1 ? current.choices[selected] : null;
    msg.textContent = current.title + " · " + current.hint +
      (choice ? " · Seleccionada: " + choice.label : "");
  }

  // El lienzo se dibuja en píxeles CSS; resize() ya configuró la densidad.
  function drawImageScaled(img, zoom) {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!img || !img.naturalWidth) {
      ctx.fillStyle = "#09090c";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = failedFiles.size ? "#ffb2b2" : "#f4f4f4";
      ctx.font = "18px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(failedFiles.size ? "No se pudo cargar el escenario" :
        "Cargando escenario...", w / 2, h / 2);
      return;
    }
    const s = Math.max(w / img.width, h / img.height) * zoom;
    const dw = img.width * s, dh = img.height * s;
    ctx.drawImage(img, (w - dw)/2, (h - dh)/2, dw, dh);
  }

  function updateSelected() {
    const buttons = spots.querySelectorAll("button");
    buttons.forEach((btn, i) => {
      const active = i === selected;
      btn.classList.toggle("active", active);
      btn.setAttribute("aria-pressed", String(active));
    });
    if (running) showSceneHint();
  }

  function renderHotspots() {
    spots.replaceChildren();
    SCENES[scene].choices.forEach((choice, i) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "hotspot";
      button.textContent = choice.label;
      button.style.left = choice.x + "%";
      button.style.top = choice.y + "%";
      button.setAttribute("aria-label", choice.label);
      button.addEventListener("pointerenter", () => {
        selected = i;
        updateSelected();
      });
      button.addEventListener("focus", () => {
        selected = i;
        updateSelected();
      });
      button.addEventListener("click", () => {
        selected = i;
        transitionTo(choice.to);
      });
      spots.appendChild(button);
    });
    updateSelected();
    showSceneHint();
  }

  function transitionTo(destination, goingBack = false) {
    if (!running || interacting || !SCENES[destination]) return;
    interacting = true;
    handsOverlay.classList.remove("walking");
    handsOverlay.classList.add("interacting");
    fade.style.opacity = "1";
    const from = scene;
    pendingTransition = setTimeout(() => {
      pendingTransition = null;
      if (goingBack) history.pop();
      else history.push(from);
      scene = destination;
      z = 1;
      selected = scene === "doors" ? 1 : 0;
      renderHotspots();
      showSceneHint();
      fade.style.opacity = "0";
      interacting = false;
      handsOverlay.classList.remove("interacting");
    }, 360);
  }

  function goBack() {
    if (!running || interacting) return;
    const previous = history[history.length - 1];
    if (previous) transitionTo(previous, true);
    else showSceneHint();
  }

  function activateSelected() {
    if (!running || interacting) return;
    const choice = SCENES[scene].choices[selected];
    if (choice) transitionTo(choice.to);
    else showSceneHint();
  }

  function selectRelative(direction) {
    const choices = SCENES[scene].choices;
    if (!running || interacting || choices.length < 2) return;
    selected = (selected + direction + choices.length) % choices.length;
    updateSelected();
  }

  function selectNumber(index) {
    const choices = SCENES[scene].choices;
    if (!running || interacting || index < 0 || index >= choices.length) return;
    selected = index;
    updateSelected();
  }

  window.addEventListener("keydown", e => {
    const key = e.key.toLowerCase();
    // e.code también permite detectar A, D y E con distintas distribuciones.
    const isLeft = key === "a" || e.code === "KeyA" || e.key === "ArrowLeft";
    const isRight = key === "d" || e.code === "KeyD" || e.key === "ArrowRight";
    const isInteract = key === "e" || e.code === "KeyE" || e.key === "Enter";
    const isBack = key === "v" || e.code === "KeyV" ||
      key === "backspace" || e.code === "Backspace" ||
      key === "delete" || e.code === "Delete";
    if (running && (isLeft || isRight || isInteract || isBack ||
      ["ArrowUp","ArrowDown"," "].includes(e.key))) {
      e.preventDefault();
    }
    keys[key] = true;
    if (e.repeat || !running) return;
    if (isLeft) selectRelative(-1);
    else if (isRight) selectRelative(1);
    else if (/^[123]$/.test(e.key)) selectNumber(Number(e.key) - 1);
    else if (isInteract) activateSelected();
    else if (isBack) goBack();
    else if (e.key === "Escape") returnToStart();
  });
  window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener("blur", () => {
    Object.keys(keys).forEach(key => { keys[key] = false; });
  });

  function loop(t) {
    if (!running) return;
    const frames = Math.min(2, (t - (previousFrame || t)) / 16.67 || 1);
    previousFrame = t;
    blink(t);

    const walking = !interacting && scene === "corridor" &&
      (keys["w"] || keys["arrowup"] || keys["s"] || keys["arrowdown"]);
    handsOverlay.classList.toggle("walking", Boolean(walking));

    if (!interacting && scene === "corridor") {
      if (keys["w"] || keys["arrowup"]) z += 0.020 * frames;
      if (keys["s"] || keys["arrowdown"]) z -= 0.020 * frames;
      z = Math.max(minZ, Math.min(maxZ, z));
      if (z >= maxZ) transitionTo("doors");
    }

    const current = SCENES[scene];
    const img = images[current.image ||
      (useLight && current.light ? current.light : current.dark)];
    ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
    drawImageScaled(img, z);
    requestAnimationFrame(loop);
  }

  function returnToStart() {
    if (pendingTransition !== null) {
      clearTimeout(pendingTransition);
      pendingTransition = null;
    }
    interacting = false;
    running = false;
    handsOverlay.classList.remove("interacting");
    handsOverlay.classList.remove("walking");
    handsOverlay.classList.remove("visible");
    fade.style.opacity = "0";
    scene = "corridor";
    history = [];
    selected = 0;
    z = 1;
    previousFrame = 0;
    spots.replaceChildren();
    startScreen.classList.remove("fadeOut");
    updateLoadStatus();
  }

  startBtn.onclick = () => {
    if (running) return;
    scene = "corridor";
    history = [];
    selected = 0;
    z = 1;
    previousFrame = 0;
    running = true;
    handsOverlay.classList.add("visible");
    renderHotspots();
    startScreen.classList.add("fadeOut");
    updateLoadStatus();
    requestAnimationFrame(loop);
  };
  document.getElementById("btnMenu").onclick = goBack;
  document.getElementById("btnHelp").onclick = () => alert(
    "VHARUM · Fase de exploración\n" +
    "W/↑: avanzar por el pasillo\nS/↓: retroceder al caminar\n" +
    "A/D o ←/→: elegir puerta; 1/2/3: elegir directamente\nE o Intro: entrar\n" +
    "Ratón/táctil: pulsar una puerta\nV / Retroceso / Supr: volver\nEsc: inicio"
  );
  document.getElementById("btnExit").onclick = returnToStart;
  updateLoadStatus();

})();
</script>
